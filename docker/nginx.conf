server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传 xlsx / 示例文件用，默认 1m 会直接 413
    client_max_body_size 50m;

    # 根路径跳到子路径，避免有人只输入 IP 看到 404
    # 用 $http_host（含端口）而不是 $host，否则换了非 80 端口会跳错地方
    location = / {
        return 302 $scheme://$http_host/jijiantongzhi/;
    }

    # 前端单页应用（hash 路由，不需要额外的 rewrite）
    location /jijiantongzhi/ {
        try_files $uri $uri/ /jijiantongzhi/index.html;
    }

    # 接口：带子路径和不带子路径都转发给后端（后端路由本身不带前缀）
    location /jijiantongzhi/api/ {
        proxy_pass http://backend:18080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 报表图片 / Excel 附件
    location /jijiantongzhi/static/ {
        proxy_pass http://backend:18080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 兼容根路径（老书签、已经发到钉钉群里的图片链接）
    location /api/ {
        proxy_pass http://backend:18080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /static/ {
        proxy_pass http://backend:18080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
