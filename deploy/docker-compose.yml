# 目标机器上的部署文件：镜像由 install.sh / 安装.bat 先 docker load 进来
# 可调的项写在同目录 .env 里（WEB_PORT、PUBLIC_BASE_URL）
services:
  backend:
    image: jijiantongzhi-backend:2.1
    container_name: jijiantongzhi-backend
    restart: unless-stopped
    volumes:
      - jijiantongzhi_data:/app/data
    environment:
      APP_DATA_DIR: /app/data
      APP_BASE_PATH: /jijiantongzhi
      APP_PORT: "18080"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      TZ: Asia/Shanghai
    networks:
      - jijiantongzhi_net

  frontend:
    image: jijiantongzhi-frontend:2.1
    container_name: jijiantongzhi-frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - jijiantongzhi_net

volumes:
  jijiantongzhi_data:
    # 固定卷名：换目录部署时数据不会跑到新卷里，升级也不丢数据
    name: jijiantongzhi_data

networks:
  jijiantongzhi_net:
